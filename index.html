<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>健康ライフ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf5f6;color:#26343c;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:720px;margin:auto;background:white;min-height:100vh}header{padding:22px 18px 18px;color:white;background:linear-gradient(135deg,#087c90,#18a0b5);border-radius:0 0 25px 25px}h1{margin:0;font-size:29px}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{padding:10px 5px;text-align:center;border:1px solid #ffffff44;border-radius:15px;background:#ffffff22}.num{font-size:22px;font-weight:800}.label{font-size:12px}main{padding:16px}.card{margin-bottom:14px;border:1px solid #dce7ea;border-radius:20px;background:#f8fbfc;overflow:hidden;box-shadow:0 2px 8px #0000000b}h2{margin:0;padding:14px 16px;border-bottom:1px solid #dce7ea;font-size:19px}.body{padding:15px}.circle{display:flex;justify-content:center}.circle svg{width:min(85vw,320px)}.center{font-size:28px;font-weight:800}.small{font-size:12px}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:82px 1fr 48px;gap:8px;align-items:center;font-size:13px}.bar{height:12px;background:#dfe9ec;border-radius:10px;overflow:hidden}.fill{height:100%;border-radius:10px;transition:.3s}.sleep{background:#2b8fc0}.exercise{background:#f7931e}.nutrition{background:#38a169}.care{background:#087e91}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{padding:14px 8px;border-radius:15px;background:white;border:1px solid #d8e3e6;font-weight:700;font-size:14px}.action small{display:block;color:#718087;margin-top:4px;font-weight:500}.log{font-size:14px;line-height:1.6;max-height:140px;overflow:auto}.log div{padding:5px 0;border-bottom:1px dashed #dbe4e7}.reward{display:none;text-align:center;border:2px solid #e7bd4a;background:#fffaf0}.reward.show{display:block}.gift{font-size:52px}.coupon{display:inline-block;padding:12px 18px;border:2px dashed #d39b18;border-radius:12px;font-weight:800;background:white}.notice{font-size:11px;color:#78878e;line-height:1.5}.reset{display:block;margin:18px auto 30px;background:none;border:0;text-decoration:underline;color:#718087}
</style>
</head>
<body>
<div class="app"><header><h1>🌿 健康ライフ</h1><div class="sub">毎日の選択で、健康サークルを育てよう</div><div class="stats"><div class="stat"><div class="num" id="money">¥0</div><div class="label">💰 お金</div></div><div class="stat"><div class="num" id="energy">100</div><div class="label">❤️ 体調</div></div><div class="stat"><div class="num" id="day">1</div><div class="label">📅 日目</div></div></div></header>
<main><section class="card"><h2>🎯 今日の健康サークル</h2><div class="body"><div class="circle"><svg viewBox="0 0 320 320"><circle cx="160" cy="160" r="125" fill="#edf3f5"/><path id="s1" fill="#2b8fc0"/><path id="s2" fill="#f7931e"/><path id="s3" fill="#38a169"/><path id="s4" fill="#087e91"/><circle cx="160" cy="160" r="72" fill="white"/><text x="160" y="154" text-anchor="middle" class="center" id="pct">0%</text><text x="160" y="178" text-anchor="middle" class="small">健康サークル</text></svg></div><div class="rows"><div class="row"><b>😴 睡眠</b><div class="bar"><div id="sleep" class="fill sleep"></div></div><b id="vsleep">0%</b></div><div class="row"><b>🏃 運動</b><div class="bar"><div id="exercise" class="fill exercise"></div></div><b id="vexercise">0%</b></div><div class="row"><b>🍚 栄養</b><div class="bar"><div id="nutrition" class="fill nutrition"></div></div><b id="vnutrition">0%</b></div><div class="row"><b>🦴 メンテ</b><div class="bar"><div id="care" class="fill care"></div></div><b id="vcare">0%</b></div></div></div></section>
<section class="card"><h2>☀️ 今日の行動</h2><div class="body actions"><button class="action" onclick="act('work')">💼 仕事をする<small>＋¥10,000　体調−8</small></button><button class="action" onclick="act('sleep')">😴 しっかり寝る<small>睡眠＋12　体調＋5</small></button><button class="action" onclick="act('exercise')">🏃 運動する<small>運動＋12　体調＋3</small></button><button class="action" onclick="act('meal')">🍚 食事を整える<small>栄養＋12　体調＋2</small></button><button class="action" onclick="act('care')">🦴 身体をメンテ<small>メンテ＋10　体調＋4</small></button><button class="action" onclick="act('rest')">🛋️ ゆっくり休む<small>体調＋8</small></button></div></section>
<section class="card"><h2>📖 今日の記録</h2><div class="body log" id="log">まだ行動していません。</div></section><section class="card reward" id="reward"><h2>🎉 健康サークル100%達成！</h2><div class="body"><div class="gift">🎁</div><p><b>健康ライフマスター</b>になりました！</p><div class="coupon">Arch 達成記念プレゼント</div><p style="font-size:12px;color:#68777e">※プレゼント内容・条件はArchで設定できます。</p></div></section><p class="notice">※これはゲーム用の健康バランスシミュレーションです。数値は実際の健康状態を診断・評価するものではありません。</p><button class="reset" onclick="resetGame()">ゲームを最初からやり直す</button></main></div>
<script>
let s=JSON.parse(localStorage.getItem('healthLife')||'null')||{money:0,energy:100,day:1,sleep:0,exercise:0,nutrition:0,care:0,log:[]};
const acts={work:['💼 仕事をした！',0,0,0,0,-8,10000],sleep:['😴 ぐっすり眠った！',12,0,0,0,5,0],exercise:['🏃 運動した！',0,12,0,0,3,0],meal:['🍚 栄養バランスを整えた！',0,0,12,0,2,0],care:['🦴 身体をメンテナンスした！',0,0,0,10,4,0],rest:['🛋️ ゆっくり休んだ！',0,0,0,0,8,0]};
function act(k){let a=acts[k];s.sleep=Math.min(100,s.sleep+a[1]);s.exercise=Math.min(100,s.exercise+a[2]);s.nutrition=Math.min(100,s.nutrition+a[3]);s.care=Math.min(100,s.care+a[4]);s.energy=Math.max(0,Math.min(100,s.energy+a[5]));s.money+=a[6];s.day++;s.log.unshift(a[0]+(a[6]?' ＋¥10,000':''));s.log=s.log.slice(0,30);localStorage.setItem('healthLife',JSON.stringify(s));render()}
function weighted(){return Math.round(s.sleep*.5+s.exercise*.2+s.nutrition*.2+s.care*.1)}
function polar(deg){let r=125,x=160+r*Math.cos(deg*Math.PI/180),y=160+r*Math.sin(deg*Math.PI/180);return[x,y]}
function path(a,b){let p1=polar(a),p2=polar(b),large=(b-a)>180?1:0;return`M160 160 L${p1[0]} ${p1[1]} A125 125 0 ${large} 1 ${p2[0]} ${p2[1]} Z`}
function render(){document.getElementById('money').textContent='¥'+s.money.toLocaleString();document.getElementById('energy').textContent=s.energy;document.getElementById('day').textContent=s.day;[['sleep','vsleep'],['exercise','vexercise'],['nutrition','vnutrition'],['care','vcare']].forEach(x=>{document.getElementById(x[0]).style.width=s[x[0]]+'%';document.getElementById(x[1]).textContent=s[x[0]]+'%'});let p=weighted();document.getElementById('pct').textContent=p+'%';let d=[180,72,72,36],start=-90;['s1','s2','s3','s4'].forEach((id,i)=>{document.getElementById(id).setAttribute('d',path(start,start+d[i]));start+=d[i]});document.getElementById('log').innerHTML=s.log.length?s.log.map(x=>'<div>'+x+'</div>').join(''):'まだ行動していません。';document.getElementById('reward').classList.toggle('show',p>=100)}
function resetGame(){if(confirm('最初からやり直しますか？')){localStorage.removeItem('healthLife');location.reload()}}render();
</script></body></html>
