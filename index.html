<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#176b86">
<title>海釣りライフ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#e8edf1;color:#263746;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:520px;margin:auto;min-height:100dvh;background:#f7f9fa}
header{background:linear-gradient(#1980a0,#12627e);color:white;padding:calc(env(safe-area-inset-top) + 10px) 12px 9px;box-shadow:0 2px 7px #0003}
.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:20px;font-weight:900}.lv{font-size:12px;background:#ffffff22;padding:6px 8px;border-radius:9px}
.resources{display:flex;gap:6px;margin-top:8px}.res{flex:1;background:#ffffff18;border:1px solid #ffffff30;border-radius:8px;padding:5px 7px;font-size:11px}.res b{font-size:15px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:white;border-bottom:1px solid #d8dee3;position:sticky;top:0;z-index:5}
nav button{border:0;background:white;padding:9px 2px 8px;font-size:11px;color:#5f6d78;font-weight:700}nav button.active{color:#0d6683;border-bottom:3px solid #0d6683}nav span{font-size:20px;display:block}
main{padding:10px 10px 90px}.panel{background:white;border:1px solid #dfe5e9;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px #0000000a}.panelHead{padding:10px 12px;background:#f0f4f6;border-bottom:1px solid #dfe5e9;font-weight:900;font-size:14px}.panelBody{padding:12px}
.sea{height:245px;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(#9ed9ed 0 35%,#1686a5 35% 100%)}
.sun{position:absolute;right:20px;top:18px;width:45px;height:45px;background:#ffe07b;border-radius:50%}.island{position:absolute;left:-30px;bottom:64%;width:170px;height:55px;background:#6eaa67;border-radius:50% 60% 0 0}.boat{position:absolute;left:50%;top:24px;transform:translateX(-50%);font-size:54px}.waves{position:absolute;left:0;right:0;top:35%;height:65%;background:repeating-linear-gradient(170deg,#1686a5 0 10px,#1d93b0 10px 15px)}
.fish{position:absolute;font-size:32px;opacity:.85;animation:swim 5s linear infinite}@keyframes swim{from{transform:translateX(0)}to{transform:translateX(300px)}}
.castline{position:absolute;left:50%;top:24%;height:48%;width:2px;background:white;display:none}.bob{position:absolute;left:calc(50% - 10px);top:70%;font-size:24px;display:none}
.bigbtn{width:100%;border:0;border-radius:10px;padding:14px;background:#f28a22;color:white;font-size:18px;font-weight:900;box-shadow:0 3px 0 #c66710}.bigbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #c66710}.bigbtn:disabled{opacity:.5}
.notice{text-align:center;font-size:13px;font-weight:800;min-height:22px;margin:8px 0}.smallbtn{border:1px solid #d7dfe4;background:white;border-radius:9px;padding:11px;font-weight:800;color:#304554}
.item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0f2;padding:11px 2px}.item:last-child{border-bottom:0}.thumb{font-size:35px;width:48px}.grow{flex:1}.name{font-weight:900;font-size:14px}.desc{font-size:11px;color:#7a8790}.price{font-weight:900;color:#d97818}.muted{font-size:12px;color:#7a8790}.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.dialog{width:min(92%,390px);background:white;border-radius:15px;padding:20px;text-align:center}.caught{font-size:78px}.dialog h2{margin:4px 0}.dialog p{font-size:13px;color:#64747f}.dialog button{width:100%;border:0;border-radius:10px;padding:13px;background:#176b86;color:white;font-weight:900;font-size:16px}
.fishcard{border:1px solid #dfe5e9;border-radius:10px;padding:10px;text-align:center;background:white}.fishcard .emoji{font-size:42px}.fishgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.unknown{filter:grayscale(1);opacity:.45}.log{font-size:12px;border-bottom:1px solid #edf0f2;padding:9px 2px}.log:last-child{border:0}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div class="title">🎣 海釣りライフ</div><div class="lv">Lv.<b id="level">1</b></div></div><div class="resources"><div class="res">💰 コイン<br><b id="coins">500</b></div><div class="res">⚡ 体力<br><b id="stamina">10</b>/10</div><div class="res">⭐ 経験値<br><b id="xp">0</b>/100</div></div></header>
<nav><button id="n-home" onclick="page('home')"><span>🎣</span>釣り</button><button id="n-fish" onclick="page('fish')"><span>🐟</span>図鑑</button><button id="n-gear" onclick="page('gear')"><span>🛠️</span>釣り具</button><button id="n-log" onclick="page('log')"><span>📜</span>記録</button></nav>
<main>
<section id="home"><div class="panel"><div class="panelHead">🌊 港の釣り場</div><div class="panelBody"><div class="sea"><div class="sun"></div><div class="island"></div><div class="waves"></div><div class="boat">🛥️</div><div class="fish" style="left:8%;top:53%">🐟</div><div class="fish" style="left:58%;top:62%;animation-delay:1s">🐠</div><div class="fish" style="left:28%;top:78%;animation-delay:2s">🐡</div><div class="castline" id="line"></div><div class="bob" id="bob">🔴</div></div><div class="notice" id="notice">今日はどんな魚が釣れるかな？</div><button class="bigbtn" id="cast" onclick="fishAction()">🎣 釣りをする（体力 −1）</button></div></div>
<div class="panel"><div class="panelHead">🎯 今日の目標</div><div class="panelBody"><div class="item"><div>魚を3匹釣る</div><b id="goal1">0 / 3</b></div><div class="item"><div>100コイン稼ぐ</div><b id="goal2">0 / 100</b></div></div></div><div class="panel"><div class="panelHead">📢 お知らせ</div><div class="panelBody muted">レベルが上がると新しい釣り場や魚が解放されるよ。</div></div></section>
<section id="fish" class="hidden"><div class="panel"><div class="panelHead">🐟 魚図鑑</div><div class="panelBody"><div class="fishgrid" id="fishGrid"></div></div></div></section>
<section id="gear" class="hidden"><div class="panel"><div class="panelHead">🛠️ 釣り具</div><div class="panelBody"><div class="item"><div class="thumb">🎣</div><div class="grow"><div class="name">木の釣り竿</div><div class="desc">現在の竿　パワー <span id="rod">1</span></div></div><button class="smallbtn" onclick="upgrade()">強化<br><span class="price">300G</span></button></div><div class="item"><div class="thumb">🪱</div><div class="grow"><div class="name">ミミズ</div><div class="desc">釣り1回につき1個消費</div></div><b id="bait">10個</b></div><div class="muted">竿を強化するとレア魚が釣れやすくなります。</div></div></div></section>
<section id="log" class="hidden"><div class="panel"><div class="panelHead">📜 釣り記録</div><div class="panelBody"><div id="logs"></div></div></div><div class="panel"><div class="panelHead">🏆 プレイヤー情報</div><div class="panelBody"><div class="item"><div>総釣果</div><b id="total">0匹</b></div><div class="item"><div>総売上</div><b id="sold">0G</b></div><div class="item"><div>最大レア度</div><b id="rare">—</b></div></div></div></section>
</main>
<div class="overlay hidden" id="modal"><div class="dialog"><div class="caught" id="caughtEmoji">🐟</div><h2 id="caughtName">魚が釣れた！</h2><p id="caughtText"></p><button onclick="closeModal()">次の魚を狙う！</button></div></div>
<script>
const fish=[{e:"🐟",n:"アジ",v:30,x:20,r:1},{e:"🐠",n:"カラフルな魚",v:55,x:25,r:2},{e:"🐡",n:"フグ",v:75,x:30,r:2},{e:"🦀",n:"カニ",v:90,x:35,r:3},{e:"🐙",n:"タコ",v:140,x:45,r:4},{e:"🦈",n:"サメ",v:500,x:100,r:5}];
let db=JSON.parse(localStorage.getItem("greeFishingV1")||"null")||{coins:500,stamina:10,xp:0,level:1,total:0,sold:0,rod:1,bait:10,caught:[],logs:[]};let state="ready",timer=null,goalFish=0,goalCoins=0;
function save(){localStorage.setItem("greeFishingV1",JSON.stringify(db));render()}
function page(p){["home","fish","gear","log"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==p));["home","fish","gear","log"].forEach(x=>document.getElementById("n-"+x).classList.toggle("active",x===p));render()}
function render(){document.getElementById("coins").textContent=db.coins.toLocaleString();document.getElementById("stamina").textContent=db.stamina;document.getElementById("xp").textContent=db.xp;document.getElementById("level").textContent=db.level;document.getElementById("bait").textContent=db.bait+"個";document.getElementById("rod").textContent=db.rod;document.getElementById("total").textContent=db.total+"匹";document.getElementById("sold").textContent=db.sold.toLocaleString()+"G";let known=db.caught.map(x=>x.n),max=db.caught.reduce((a,x)=>Math.max(a,x.r),0);document.getElementById("rare").textContent=max?["","★","★★","★★★","★★★★","★★★★★"][max]:"—";document.getElementById("goal1").textContent=Math.min(goalFish,3)+" / 3";document.getElementById("goal2").textContent=Math.min(goalCoins,100)+" / 100";document.getElementById("fishGrid").innerHTML=fish.map(f=>{let k=known.includes(f.n);return `<div class="fishcard ${k?'':'unknown'}"><div class="emoji">${k?f.e:"❓"}</div><b>${k?f.n:"？？？"}</b><div class="muted">${k?"売値 "+f.v+"G":"未発見"}</div></div>`}).join("");document.getElementById("logs").innerHTML=db.logs.length?db.logs.slice(0,30).map(l=>`<div class="log">${l}</div>`).join(""):"<div class='muted'>まだ記録がありません。</div>"}
function fishAction(){if(state!=="ready")return;if(db.stamina<=0){document.getElementById("notice").textContent="⚡ 体力がありません。しばらく休もう！";return}if(db.bait<=0){document.getElementById("notice").textContent="🪱 エサがありません。";return}db.stamina--;db.bait--;save();state="waiting";document.getElementById("cast").textContent="⏳ 魚を待っています…";document.getElementById("line").style.display="block";document.getElementById("bob").style.display="block";document.getElementById("notice").textContent="水面をよく見よう…";let delay=900+Math.random()*2600;timer=setTimeout(()=>{state="bite";document.getElementById("cast").textContent="⚡ HIT！ 引き上げる！";document.getElementById("notice").textContent="🐟 魚が食いついた！ 今だ！";navigator.vibrate?.([70,40,70])},delay);setTimeout(()=>{if(state==="waiting"){state="ready";cleanup();document.getElementById("notice").textContent="魚に逃げられた…😢";document.getElementById("cast").textContent="🎣 釣りをする（体力 −1）"}},delay+1900)}
document.getElementById("cast").addEventListener("click",e=>{if(state==="bite"){e.preventDefault();catchIt()}});
function catchIt(){clearTimeout(timer);let pool=fish.map(f=>({...f,w:f.r===1?45:f.r===2?27:f.r===3?14:f.r===4?7:2}));pool.forEach(f=>f.w*=1+(f.r-1)*0.08*(db.rod-1));let n=Math.random()*pool.reduce((a,f)=>a+f.w,0),p=pool[0];for(const f of pool){n-=f.w;if(n<=0){p=f;break}}db.total++;db.coins+=p.v;db.xp+=p.x;db.sold+=p.v;goalFish++;goalCoins+=p.v;if(!db.caught.some(x=>x.n===p.n))db.caught.push(p);db.logs.unshift(new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+"　"+p.e+" "+p.n+" を釣った！ +"+p.v+"G");if(db.xp>=100){db.xp-=100;db.level++;db.stamina=Math.min(10,db.stamina+3);db.logs.unshift("🎉 レベルアップ！ Lv."+db.level+" になった！")}save();state="caught";cleanup();document.getElementById("caughtEmoji").textContent=p.e;document.getElementById("caughtName").textContent=p.n+" GET！";document.getElementById("caughtText").textContent="売値 "+p.v+"G　｜　経験値 +"+p.x+"　｜　図鑑 "+db.caught.length+" / "+fish.length;document.getElementById("modal").classList.remove("hidden")}
function cleanup(){document.getElementById("line").style.display="none";document.getElementById("bob").style.display="none"}
function closeModal(){document.getElementById("modal").classList.add("hidden");state="ready";document.getElementById("cast").disabled=false;document.getElementById("cast").textContent="🎣 釣りをする（体力 −1）";document.getElementById("notice").textContent="次は何が釣れるかな？"}
function upgrade(){if(db.rod>=5){alert("これ以上強化できません！");return}if(db.coins<300){alert("コインが足りません。");return}db.coins-=300;db.rod++;db.logs.unshift("🛠️ 釣り竿を強化！ パワー "+db.rod);save();alert("釣り竿が強化されました！")}
setInterval(()=>{if(db.stamina<10&&state==="ready"){db.stamina++;save()}},30000);render();page("home");
</script></div></body></html>
